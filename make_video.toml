# Your defaults for make_video.py. Any option can go here, written like the command-line option
# without the leading dashes (generate-visuals = true, image-model = "flux-2-klein-4b", ...).
# Each channel's look and sound (name, intro and outro, image style, voice, speed, captions, music, YouTube text
# style) is in channels/<channel>.toml, which wins over this file; options you type on the command line win over both.
default-channel = "smart_village_boy"  # used unless the script has "# channel: <id>" or you pass --channel
[defaults]
generate-visuals = true  # AI images / stock for scenes without [visual:]  (one run without: --no-generate-visuals)
check-images = true      # vision check for extra fingers, limbs, text; ~40 neurons an image  (--no-check-images)
# every final render also sharpens its images with Real-ESRGAN on Kaggle (originals if Kaggle fails)
# Cloudflare makes every final prompt and image (Workers Paid bills past the free 10,000 neurons a day).
# Pollinations is only the backup for a scene Cloudflare still fails after a retry, or past the cap below.
max-daily-neurons = 60000  # daily spending cap, Nairobi time: about $0.55 a day beyond the free 10,000; 0 = no cap
draft-images = false       # true = every run is a quick Pollinations draft to Working/<name>_DRAFT.mp4  (--draft)
media = "mixed"      # mixed = stock footage where it matches well, else AI images; "stock" or "ai"
stock = "auto"       # auto = Pexels and Pixabay, whichever has a key in .env; or "pexels" / "pixabay"
# making still pictures feel alive (Remotion)
depth = "strong"     # 2.5D parallax on pictures with a clear foreground: "strong", "subtle" or "off"
overlays = true      # subtle dust, smoke, mist, rain, heat shimmer, firelight, leaves, ripples or light rays (drawn in code)
camera = "bold"      # "bold": faster pushes, pans and tilts, whip-pan / zoom between chapters; "calm": slow, crossfades
sound-effects = true # quiet CC0 ambience under each scene (wind, water, birds, fire, market, rain), ducked under the voice
sfx-volume = 0.5     # ambience level before ducking
two-shots = true     # scenes over 6 s get a second shot of the same moment (about doubles the image neurons; see --check)
