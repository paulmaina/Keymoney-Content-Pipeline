# Runs on every pull request and on main. No secrets: the tests mock Cloudflare, Kaggle, Pexels and Pixabay, so CI never
# uses the free allowances. Real renders stay local (they need Remotion's browser, models and Cloudflare).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests (Windows)
    runs-on: windows-latest  # the same OS the videos are made on
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install packages
        run: python -m pip install -r requirements.txt "pytest>=9"
      - name: Run tests
        run: python -m pytest -q

  typecheck:
    name: Remotion type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
